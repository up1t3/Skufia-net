services:
  prometheus:
    image: prom/prometheus:latest
    container_name: skufia-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: skufia-grafana
    ports:
      - "3000:3000"
    restart: always
