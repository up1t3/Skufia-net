name: Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install bcrypt==4.0.1
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        run: |
          mkdir -p backend/data
          touch backend/data/skufia.db
          DATABASE_URL="sqlite:///./backend/data/skufia.db" PYTHONPATH="$GITHUB_WORKSPACE/backend" python -m pytest backend/tests/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend linting
        working-directory: frontend
        run: npx eslint . || true

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build
          
      - name: Tag and Push Docker images
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag skufia-postgres ghcr.io/$REPO_OWNER/skufia-postgres:latest || true
          docker tag skufia-api ghcr.io/$REPO_OWNER/skufia-api:latest
          docker tag skufia-celery ghcr.io/$REPO_OWNER/skufia-celery:latest
          docker tag skufia-frontend ghcr.io/$REPO_OWNER/skufia-frontend:latest || true
          
          docker push ghcr.io/$REPO_OWNER/skufia-api:latest
          docker push ghcr.io/$REPO_OWNER/skufia-celery:latest
          # Optional pushes if customized:
          # docker push ghcr.io/$REPO_OWNER/skufia-postgres:latest || true
          # docker push ghcr.io/$REPO_OWNER/skufia-frontend:latest || true

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: success()
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/skufia
            bash deploy.sh
