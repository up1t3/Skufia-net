services:
  postgres:
    image: postgres:16
    container_name: skufia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skufia
    volumes:
      - skufia_pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: skufia-redis
    restart: always

  celery:
    build:
      context: ./backend
    container_name: skufia-celery
    command: python worker.py
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - skufia_uploads:/app/uploads
      - skufia_db:/app/data
    restart: always

  coturn:
    image: coturn/coturn
    container_name: skufia-coturn
    restart: always
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command: turnserver --use-auth-secret --static-auth-secret=skufia_secret --realm=skufia.local

  backend:
    build:
      context: ./backend
    container_name: skufia-api
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/skufia
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - skufia_uploads:/app/uploads
      - skufia_db:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: skufia-web
    ports:
      - "5551:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx_full.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: always

volumes:
  skufia_uploads:
  skufia_db:
  skufia_pgdata: