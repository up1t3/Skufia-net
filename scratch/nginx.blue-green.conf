upstream skufia_backend {
    # Этот порт будет автоматически меняться скриптом деплоя (например, с 5001 на 5002)
    server 127.0.0.1:5001; 
}

server {
    listen 80;
    server_name _; # Или ваш домен

    # Для WebSocket (чат)
    location /ws/ {
        proxy_pass http://skufia_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Для REST API
    location /api/ {
        proxy_pass http://skufia_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Для PWA Фронтенда (раздача статики)
    location / {
        root /var/www/skufia/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
