<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Установка SKUFenger</title>
    <!-- Подключаем манифест PWA -->
    <link rel="manifest" href="manifest-skufenger.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <!-- Шрифты для красивого кибер-стиля -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-cyan: #00f2ff;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --font-main: 'Rajdhani', -apple-system, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 242, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 242, 255, 0.05), transparent 25%);
        }
        .container {
            padding: 20px;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            border-radius: 28px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            animation: pulse 3s infinite alternate;
        }
        @keyframes pulse {
            from { box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); transform: scale(1); }
            to { box-shadow: 0 0 45px rgba(0, 242, 255, 0.5); transform: scale(1.02); }
        }
        h1 {
            font-size: 32px;
            margin: 0 0 10px 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }
        p.subtitle {
            font-size: 18px;
            color: var(--text-dim);
            margin: 0 0 40px 0;
            line-height: 1.4;
            font-weight: 500;
        }
        .install-btn {
            background: linear-gradient(135deg, #00f2ff 0%, #0088ff 100%);
            color: #000;
            border: none;
            padding: 18px 32px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--font-main);
        }
        .install-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 242, 255, 0.4);
        }
        .install-btn:disabled {
            background: #1e293b;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
            border: 1px solid #334155;
        }
        
        /* Блок инструкций для iOS */
        .ios-instruction {
            display: none;
            background: rgba(30, 41, 59, 0.7);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            text-align: left;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .ios-instruction h3 {
            margin-top: 0;
            color: var(--accent-cyan);
            font-size: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ios-step {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 16px;
            color: #e2e8f0;
            line-height: 1.4;
            font-weight: 500;
        }
        .ios-step:last-child {
            margin-bottom: 0;
        }
        .step-num {
            background: rgba(0, 242, 255, 0.15);
            color: var(--accent-cyan);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
            flex-shrink: 0;
            border: 1px solid rgba(0, 242, 255, 0.3);
        }
        .ios-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #007aff;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            margin: 0 8px;
            vertical-align: middle;
        }
        .highlight {
            color: #fff;
            font-weight: 600;
        }
        
        .loading-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 242, 255, 0.3);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <img src="favicon.png" alt="SKUFenger Logo" class="logo">
    <h1>SKUFenger</h1>
    <p class="subtitle">Установите приложение для мгновенного доступа без браузера.</p>

    <!-- Кнопка для Android -->
    <button id="install-btn" class="install-btn">
        <span id="btn-text">ПРОВЕРКА...</span>
        <div id="btn-spinner" class="loading-spinner"></div>
    </button>

    <!-- Инструкция для iPhone (Apple запрещает авто-установку PWA) -->
    <div id="ios-instruction" class="ios-instruction">
        <h3>Установка на iPhone</h3>
        <div class="ios-step">
            <div class="step-num">1</div>
            <div>Нажмите иконку <span class="ios-icon"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V1m0 0L3 5m4-4l4 4"/><path d="M1 9v4a2 2 0 002 2h8a2 2 0 002-2V9"/></svg></span> <b>Поделиться</b> внизу экрана Safari.</div>
        </div>
        <div class="ios-step">
            <div class="step-num">2</div>
            <div>Прокрутите вниз и выберите <span class="highlight">«На экран Домой»</span> <span class="ios-icon" style="background:#333; color:#fff; border-radius:4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>.</div>
        </div>
        <div class="ios-step">
            <div class="step-num">3</div>
            <div>Нажмите <span class="highlight">«Добавить»</span> в правом верхнем углу.</div>
        </div>
    </div>
</div>

<script>
    // 1. Регистрация Service Worker (обязательное условие для PWA)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('chat-sw.js')
                .then(reg => console.log('ServiceWorker registered for install page'))
                .catch(err => console.log('SW registration failed:', err));
        });
    }

    const installBtn = document.getElementById('install-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const iosInstruction = document.getElementById('ios-instruction');

    // Определение ОС и статуса установки
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    function setBtnState(text, disabled = false, showSpinner = false) {
        btnText.textContent = text;
        btnText.style.display = showSpinner ? 'none' : 'block';
        btnSpinner.style.display = showSpinner ? 'block' : 'none';
        installBtn.disabled = disabled;
    }

    if (isStandalone) {
        // Уже установлено и открыто как приложение
        setBtnState('ОТКРЫТЬ МЕССЕНДЖЕР');
        installBtn.addEventListener('click', () => {
            window.location.href = 'messenger.html';
        });
    } else if (isIOS) {
        // iOS: Apple запрещает программный вызов установки, показываем инструкцию
        installBtn.style.display = 'none';
        iosInstruction.style.display = 'block';
    } else {
        // Android / Desktop Chrome: Ждем события beforeinstallprompt
        let deferredPrompt = null;
        setBtnState('', true, true); // Показываем спиннер

        window.addEventListener('beforeinstallprompt', (e) => {
            // Предотвращаем автоматический показ мини-инфобара в старых Chrome
            e.preventDefault();
            // Сохраняем событие для вызова по кнопке
            deferredPrompt = e;
            // Активируем кнопку
            setBtnState('УСТАНОВИТЬ ПРИЛОЖЕНИЕ');
        });

        // Если PWA не поддерживается или уже установлено (но открыто в браузере), 
        // событие beforeinstallprompt может не сработать. Делаем таймаут.
        setTimeout(() => {
            if (!deferredPrompt && !isStandalone) {
                // Фоллбэк: просто перенаправляем в веб-версию
                setBtnState('ОТКРЫТЬ В БРАУЗЕРЕ');
                installBtn.onclick = () => { window.location.href = 'messenger.html'; };
            }
        }, 3000);

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Показываем нативное окно установки Android
                deferredPrompt.prompt();
                
                // Ждем ответа пользователя
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                    setBtnState('УСТАНОВКА...');
                    
                    // Небольшая пауза перед перенаправлением, чтобы система успела добавить ярлык
                    setTimeout(() => {
                        setBtnState('УСТАНОВЛЕНО (ОТКРЫТЬ)');
                        installBtn.onclick = () => { window.location.href = 'messenger.html'; };
                    }, 2000);
                } else {
                    console.log('User dismissed the install prompt');
                }
                // Сбрасываем событие (его можно вызвать только один раз)
                deferredPrompt = null;
            }
        });
    }
</script>

</body>
</html>
