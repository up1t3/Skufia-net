user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    include /etc/nginx/upstream.conf;

    server {
        listen 80;
        server_name skuf-net.ru xn--e1afmapc3af.xn--p1ai 147.45.245.133 localhost;

        # Разрешаем запросы Certbot для верификации
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Редирект всех остальных запросов на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name skuf-net.ru xn--e1afmapc3af.xn--p1ai 147.45.245.133 localhost;

        ssl_certificate /etc/letsencrypt/live/skuf-net.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/skuf-net.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Статические файлы фронтенда
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Проксирование API-запросов на бэкенд
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Проксирование WebSocket соединений
        location /ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Статические ассеты с кэшем
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # Редирект путей /api/uploads на бекендовский /uploads (для аватарок)
        location /api/uploads/ {
            proxy_pass http://backend_api/uploads/;
            proxy_set_header Host $host;
        }

        error_page 404 /index.html;
    }
}
